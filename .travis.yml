sudo: required
language: c
group: bluezone

git:
  submodules: false
  depth: false

services:
  - docker

os:
  - linux-ppc64le

dist: xenial

env:
    matrix:
       - DISTRO='rhel81'
       - DISTRO='rhel8'
       - DISTRO='rhel76'
       - DISTRO='rhel77'
       - DISTRO='rhel78'
       - DISTRO='rhelalt76'

install:
  - git config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*
  - git fetch --all
  - git branch -avv

script:
  - REPO_URL="${REPO_URL:-sys-kernelbackport-kernelbackport-docker-local.artifactory.swg-devops.com}"
  - docker login  ${REPO_URL} --username=${My_User} --password=${My_Password}
  - if [[ "${TRAVIS_BRANCH}" == "master" ]]; then docker pull ${REPO_URL}/${DISTRO}; fi
  - if [[ "${TRAVIS_BRANCH}" == "master" ]]; then docker run -v $(pwd):/root/kernels -w /root/kernels/ -it ${REPO_URL}/${DISTRO} /root/kernels/.update -f "${FTP3_Credentials}" -d "${DISTRO}" -n "${My_Name}" -e "${My_Email}" ;fi


notifications:
  slack: ibm-systems:ABskLHaZCkLZgxsfknsYhcWA#btaas
