sudo: required
language: shell
os: linux-ppc64le

git:
  submodules: false
  depth: 10
services:
  - docker
env:
    matrix:
       - DISTRO=rhel92
install:
  - git config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*

branches:
  only:
    - master

script:
- REPO_URL="${REPO_URL:-sys-kernelbackport-kernelbackport-docker-local.artifactory.swg-devops.com}"
- docker login  ${REPO_URL} --username=${My_User} --password=${My_Password}
- docker pull ${REPO_URL}/${DISTRO}
- docker run -v $(pwd):/root/kernels -w /root/kernels/ -it ${REPO_URL}/${DISTRO} /root/kernels/.update -f "${FTP3_Credentials}" -d "${DISTRO}" -n "${My_Name}" -e "${My_Email}"
